def startupRoot = file('run/startup')
def serverStartupRoot = file("${startupRoot}/server")
def clientStartupRoot = file("${startupRoot}/client")
def serverStartupResult = file("${serverStartupRoot}/startup.result")
def clientStartupResult = file("${clientStartupRoot}/startup.result")
def allowedOverwriteConflictParts = [
        'c2me-opts-allocs.mixins.json:predicates.mixinoffsetpredicate',
        'com.moepus.byepregen.mixin.feature.predicate.statetestingpredicatemixin',
]

neoForge {
    runs {
        startupServer {
            server()
            byepregenUseTestConfig(delegate)
            sourceSet.set(sourceSets.startupHarness)
            loadedMods.set([
                    neoForge.mods.named(project.mod_id).get(),
                    neoForge.mods.named('byepregen_startup_harness').get(),
            ] as Set)
            gameDirectory = serverStartupRoot
            programArgument '--nogui'
            systemProperty 'byepregen.startupResult', serverStartupResult.absolutePath
            systemProperty 'neoforge.enabledGameTestNamespaces', ''
            logLevel = org.slf4j.event.Level.INFO
        }
        startupClient {
            client()
            byepregenUseTestConfig(delegate)
            sourceSet.set(sourceSets.startupHarness)
            loadedMods.set([
                    neoForge.mods.named(project.mod_id).get(),
                    neoForge.mods.named('byepregen_startup_harness').get(),
            ] as Set)
            gameDirectory = clientStartupRoot
            systemProperty 'byepregen.startupResult', clientStartupResult.absolutePath
            systemProperty 'neoforge.enabledGameTestNamespaces', ''
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

def validateStartup = { String side, File root, File result ->
    String outcome = byepregenAssertPassResult(result, "${side} startup")
    if (side == 'Client') {
        def fields = new Properties()
        fields.load(new StringReader(outcome))
        if (fields.getProperty('screen') != 'net.minecraft.client.gui.screens.TitleScreen'
                || fields.getProperty('resourcesLoaded') != 'true'
                || fields.getProperty('loadingErrors') != '0'
                || (fields.getProperty('stableTicks', '0') as int) < 5) {
            throw new GradleException("Client startup did not reach a fully loaded title screen:\n${outcome}")
        }
    }
    byepregenAssertNoTestConfigFile(root)
    File log = file("${root}/logs/latest.log")
    if (!log.isFile()) {
        throw new GradleException("${side} startup produced no latest.log: ${log}")
    }
    def logLines = log.readLines('UTF-8')
    def allowedConflicts = logLines.findAll { line ->
        String lower = line.toLowerCase(Locale.ROOT)
        allowedOverwriteConflictParts.every { lower.contains(it) }
    }
    if (allowedConflicts.size() > 1 || allowedConflicts.any {
        !it.toLowerCase(Locale.ROOT).contains('skipping method')
    }) {
        throw new GradleException("${side} startup found an unexpected C2ME overwrite conflict:\n"
                + allowedConflicts.join('\n'))
    }
    def failures = logLines.findAll { line ->
        String lower = line.toLowerCase(Locale.ROOT)
        boolean byepregenLine = lower.contains('byepregen') || lower.contains('bye pregen')
        boolean failureMarker = [
                'mixin apply', 'target', 'not found', 'failed injection', 'critical injection',
                'invalid mixin', 'error loading class', 'unregistered mixin', 'gate drift',
                'skipped overwrite', 'overwrite conflict', 'byepregen_startup_fail',
        ].any { lower.contains(it) }
        boolean allowedConflict = allowedOverwriteConflictParts.every { lower.contains(it) }
                && lower.contains('skipping method')
        byepregenLine && failureMarker && !allowedConflict
    }
    if (!failures.isEmpty()) {
        throw new GradleException("${side} startup log contains ByePregen mixin failures:\n"
                + failures.join('\n'))
    }
    logger.lifecycle("${side} startup passed:\n${outcome.trim()}")
}

tasks.matching { it.name == 'runStartupServer' }.configureEach {
    group = 'verification'
    description = 'Starts an ordinary dedicated server with ByePregen and exits after ServerStartedEvent.'
    notCompatibleWithConfigurationCache('Prepares and validates a disposable startup server')
    doFirst {
        delete(serverStartupRoot)
        prepareDisposableServer([
                directory: serverStartupRoot,
                serverProperties: [
                        'level-name'         : 'world',
                        'level-seed'         : 'byepregen-startup',
                        'online-mode'        : false,
                        'max-tick-time'      : 0,
                        'view-distance'      : 2,
                        'simulation-distance': 2,
                        'spawn-protection'   : 0,
                ],
        ])
    }
    doLast { validateStartup('Server', serverStartupRoot, serverStartupResult) }
}

tasks.matching { it.name == 'runStartupClient' }.configureEach {
    group = 'verification'
    description = 'Starts a client with ByePregen and verifies a fully loaded, stable title screen.'
    notCompatibleWithConfigurationCache('Prepares and validates a disposable startup client')
    doFirst {
        delete(clientStartupRoot)
        clientStartupRoot.mkdirs()
        new File(clientStartupRoot, 'options.txt').setText('onboardAccessibility:false\n', 'UTF-8')
        def fixtureConfig = new File(clientStartupRoot, 'config')
        fixtureConfig.mkdirs()
        // The disposable client proceeds past warning-only prompts (e.g. Chunky's deprecated logoFile).
        // NeoForge and the probe still log every issue; errors and unfinished startup cannot pass.
        new File(fixtureConfig, 'neoforge-client.toml').setText('showLoadWarnings=false\n', 'UTF-8')
    }
    doLast { validateStartup('Client', clientStartupRoot, clientStartupResult) }
}

tasks.register('testServerStartup') {
    group = 'verification'
    description = 'Verifies ordinary dedicated-server startup and ByePregen mixin logs.'
    dependsOn('runStartupServer')
}

tasks.register('testClientStartup') {
    group = 'verification'
    description = 'Verifies ordinary client startup and ByePregen mixin logs.'
    dependsOn('runStartupClient')
}

tasks.register('startupCheck') {
    group = 'verification'
    description = 'Runs ordinary dedicated-server and client startup verification.'
    dependsOn('testServerStartup', 'testClientStartup')
}
