def runtimeCheckRequested = gradle.startParameter.taskNames.any {
    it.tokenize(':').last() == 'runtimeCheck'
}

def worldGenConfig = [
        dir    : file(byepregenProp('byepregenTestWorldGenDir', 'run/test-worldgen')),
        radius : runtimeCheckRequested ? '16' : byepregenProp('byepregenTestWorldGenRadius', '700'),
        seed   : byepregenProp('byepregenTestWorldGenSeed', 'byepregen-test-worldgen'),
        gcFree : byepregenProp('byepregenTestWorldGenGcFree', 'true'),
        yaLight: byepregenProp('byepregenTestWorldGenYALight', 'true'),
        surfaceBiomeCache: byepregenProp('byepregenTestSurfaceBiomeCache', 'true'),
        surfaceScalar: byepregenProp('byepregenTestSurfaceScalar', 'true'),
        surfaceOutputDifferential: providers.gradleProperty('byepregenTestSurfaceOutputDifferential')
                .orElse(providers.gradleProperty('byepregenTestSurfaceDifferential'))
                .orElse('false')
                .get(),
        noFeatures: byepregenProp('byepregenTestWorldGenNoFeatures', 'false'),
        levelType: byepregenProp('byepregenTestWorldGenLevelType', 'minecraft:normal'),
        enablePlacedFeatureMixin: byepregenProp('byepregenTestEnablePlacedFeatureMixin', 'false'),
        logCompilation: byepregenProp('byepregenTestLogCompilation', 'false').toBoolean(),
        surfaceBiomeProfile: byepregenProp('byepregenTestSurfaceBiomeProfile', 'false'),
        datapack: providers.gradleProperty('byepregenTestWorldGenDatapack').orNull,
]
def arenaPaletteRoot = file('run/arena-palette-differential')
def arenaPaletteResult = file("${arenaPaletteRoot}/arena-palette.result")
def chunkNbtParityRoot = file('run/chunk-nbt-parity')
def chunkNbtParityResult = file("${chunkNbtParityRoot}/chunk-nbt-parity.result")
def defaultWorldGenLabel = "gc${worldGenConfig.gcFree}" +
        "-scalar${worldGenConfig.surfaceScalar}" +
        "-cache${worldGenConfig.surfaceBiomeCache}" +
        "-noFeatures${worldGenConfig.noFeatures}" +
        "-outputDiff${worldGenConfig.surfaceOutputDifferential}" +
        "-biomeProfile${worldGenConfig.surfaceBiomeProfile}"
worldGenConfig.label = byepregenProp('byepregenTestWorldGenLabel', defaultWorldGenLabel)
worldGenConfig.jfr = file(
        "${worldGenConfig.dir}/byepregen-worldgen-radius" +
                "${byepregenSanitizeRunName(worldGenConfig.radius)}-" +
                "${byepregenSanitizeRunName(worldGenConfig.label)}.jfr"
)
worldGenConfig.jfrRepository = file("${worldGenConfig.dir}/jfr-repository")
worldGenConfig.tmpDir = file("${worldGenConfig.dir}/tmp")
worldGenConfig.compilationLog = file(byepregenProp(
        'byepregenTestCompilationLog',
        "${worldGenConfig.dir}/hotspot-compilation.log"
))

neoForge {
    runs {
        arenaPaletteDifferential {
            byepregenConfigureWorldgenRun(delegate, [
                    dir : arenaPaletteRoot,
                    mode: 'arena_palette',
            ])
            systemProperty 'byepregen.arenaPaletteDifferentialResult', arenaPaletteResult.absolutePath
        }
        chunkNbtParity {
            byepregenConfigureWorldgenRun(delegate, [
                    dir : chunkNbtParityRoot,
                    mode: 'chunk_nbt_parity',
            ])
            systemProperty 'byepregen.chunkNbtParityResult', chunkNbtParityResult.absolutePath
        }
        testWorldGen {
            byepregenConfigureWorldgenRun(delegate, [
                    dir          : worldGenConfig.dir,
                    radius       : worldGenConfig.radius,
                    jfrFile      : worldGenConfig.jfr,
                    jfrRepository: worldGenConfig.jfrRepository,
                    surfaceBiomeCache: worldGenConfig.surfaceBiomeCache,
                    surfaceScalar: worldGenConfig.surfaceScalar,
                    surfaceOutputDifferential: worldGenConfig.surfaceOutputDifferential,
                    surfaceBiomeProfile: worldGenConfig.surfaceBiomeProfile,
                    enablePlacedFeatureMixin: worldGenConfig.enablePlacedFeatureMixin,
                    compilationLog: worldGenConfig.logCompilation ? worldGenConfig.compilationLog : null,
            ])
        }
    }
}

tasks.matching { it.name == 'runArenaPaletteDifferential' }.configureEach {
    group = 'verification'
    description = 'Differentially checks Arena palette operations against vanilla.'
    notCompatibleWithConfigurationCache('Validates a result produced by a disposable test server')
    doFirst {
        delete(arenaPaletteResult)
        byepregenPrepareWorldgenRunDir([
                dir         : arenaPaletteRoot,
                arenaPalette: 'true',
                yaLight     : 'false',
                gcFree      : 'false',
                clearWorld  : true,
        ])
    }
    doLast {
        if (!arenaPaletteResult.isFile()) {
            throw new GradleException("Arena palette differential produced no result: ${arenaPaletteResult}")
        }
        String result = arenaPaletteResult.getText('UTF-8')
        if (!result.startsWith('PASS\n')) {
            throw new GradleException("Arena palette differential failed:\n${result}")
        }
        logger.lifecycle("Arena palette differential passed:\n${result.trim()}")
    }
}

tasks.register('testArenaPaletteDifferential') {
    group = 'verification'
    description = 'Differentially checks Arena palette operations against vanilla.'
    dependsOn('runArenaPaletteDifferential')
}

tasks.matching { it.name == 'runChunkNbtParity' }.configureEach {
    group = 'verification'
    description = 'Checks full chunk NBT parity and raw-save compression round trips.'
    notCompatibleWithConfigurationCache('Validates a result produced by a disposable test server')
    doFirst {
        delete(chunkNbtParityResult)
        byepregenPrepareWorldgenRunDir([
                dir         : chunkNbtParityRoot,
                arenaPalette: 'false',
                yaLight     : 'false',
                gcFree      : 'false',
                clearWorld  : true,
        ])
    }
    doLast {
        if (!chunkNbtParityResult.isFile()) {
            throw new GradleException("Chunk NBT parity produced no result: ${chunkNbtParityResult}")
        }
        String result = chunkNbtParityResult.getText('UTF-8')
        if (!result.startsWith('PASS\n')) {
            throw new GradleException("Chunk NBT parity failed:\n${result}")
        }
        logger.lifecycle("Chunk NBT parity passed:\n${result.trim()}")
    }
}

tasks.register('testChunkNbtParity') {
    group = 'verification'
    description = 'Checks full chunk NBT parity and raw-save compression round trips.'
    dependsOn('runChunkNbtParity')
}

tasks.matching { it.name == 'runTestWorldGen' }.configureEach {
    notCompatibleWithConfigurationCache('Prepares a disposable test world before launching the server')
    doFirst {
        delete(worldGenConfig.jfr)
        if (worldGenConfig.logCompilation) {
            delete(worldGenConfig.compilationLog)
            worldGenConfig.compilationLog.parentFile.mkdirs()
        }
        worldGenConfig.jfrRepository.mkdirs()
        worldGenConfig.tmpDir.mkdirs()
        byepregenPrepareWorldgenRunDir([
                dir       : worldGenConfig.dir,
                yaLight   : worldGenConfig.yaLight,
                gcFree    : worldGenConfig.gcFree,
                surfaceScalar: worldGenConfig.surfaceScalar,
                seed      : worldGenConfig.seed,
                noFeatures: worldGenConfig.noFeatures,
                levelType : worldGenConfig.levelType,
                enablePlacedFeatureMixin: worldGenConfig.enablePlacedFeatureMixin,
                clearWorld: true,
        ])
        if (worldGenConfig.datapack != null) {
            copy {
                from file(worldGenConfig.datapack)
                into file("${worldGenConfig.dir}/world/datapacks")
            }
        }
    }
}
