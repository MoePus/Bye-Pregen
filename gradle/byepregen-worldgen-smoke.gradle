tasks.matching { it.name == 'runTestWorldGen' }.configureEach {
    Map testOptions = [
            dir                       : worldGenConfig.dir,
            yaLight                   : worldGenConfig.yaLight,
            gcFree                    : worldGenConfig.gcFree,
            surfaceScalar             : worldGenConfig.surfaceScalar,
            surfaceBiomeCache         : worldGenConfig.surfaceBiomeCache,
            seed                      : worldGenConfig.seed,
            noFeatures                : worldGenConfig.noFeatures,
            densityColumnCompiler     : worldGenConfig.densityColumnCompiler,
            enableMemoizedDiskPlan    : worldGenConfig.enableMemoizedDiskPlan,
            c2meDfc                    : worldGenConfig.c2meDfc,
            levelType                 : worldGenConfig.singleBiome == null
                    ? worldGenConfig.levelType
                    : 'byepregen:wwoo_single_biome',
            enablePlacedFeatureMixin  : worldGenConfig.enablePlacedFeatureMixin,
            initialEnabledPacks       : worldGenConfig.initialEnabledPacks,
            clearWorld                : true,
    ]
    byepregenUseWorldgenTestConfig(delegate, testOptions)
    notCompatibleWithConfigurationCache('Prepares a disposable test world before launching the server')
    doFirst {
        delete(worldGenConfig.jfr)
        if (worldGenConfig.logCompilation) {
            delete(worldGenConfig.compilationLog)
            worldGenConfig.compilationLog.parentFile.mkdirs()
        }
        worldGenConfig.jfrRepository.mkdirs()
        worldGenConfig.tmpDir.mkdirs()
        byepregenPrepareWorldgenRunDir(testOptions)
        if (worldGenConfig.datapack != null) {
            copy {
                from file(worldGenConfig.datapack)
                into file("${worldGenConfig.dir}/world/datapacks")
            }
        }
        if (worldGenConfig.singleBiome != null) {
            writeSingleBiomeWorldPreset(worldGenConfig.dir, worldGenConfig.singleBiome)
        }
    }
    doLast {
        if (worldGenConfig.gcFree.toBoolean()) {
            File log = file("${worldGenConfig.dir}/logs/latest.log")
            String text = log.isFile() ? log.getText('UTF-8') : ''
            if (!text.contains('ByePregen GC-free raw chunk save is using C2ME IDirectStorage')
                    || !text.contains('ByePregen GC-free raw chunk save intercepted C2ME ReadFromDisk')) {
                throw new GradleException("C2ME core raw serializer was not exercised: ${log}")
            }
        }
    }
}

byepregenConfigureWorldgenResultTask('runTestWorldGen', worldGenConfig.dir)
