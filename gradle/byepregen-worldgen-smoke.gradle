def writeSingleBiomeWorldPreset = { File runDir, String biome ->
    File pack = file("${runDir}/world/datapacks/byepregen-single-biome")
    writeJsonFile(file("${pack}/pack.mcmeta"), [
            pack: [
                    pack_format: 15,
                    description: "ByePregen fixed-biome worldgen profile for ${biome}",
            ],
    ])
    writeJsonFile(file("${pack}/data/byepregen/worldgen/world_preset/wwoo_single_biome.json"), [
            dimensions: [
                    'minecraft:overworld': [
                            type: 'minecraft:overworld',
                            generator: [
                                    type: 'minecraft:noise',
                                    biome_source: [type: 'minecraft:fixed', biome: biome],
                                    settings: 'minecraft:overworld',
                            ],
                    ],
                    'minecraft:the_nether': [
                            type: 'minecraft:the_nether',
                            generator: [
                                    type: 'minecraft:noise',
                                    biome_source: [type: 'minecraft:multi_noise', preset: 'minecraft:nether'],
                                    settings: 'minecraft:nether',
                            ],
                    ],
                    'minecraft:the_end': [
                            type: 'minecraft:the_end',
                            generator: [
                                    type: 'minecraft:noise',
                                    biome_source: [type: 'minecraft:the_end'],
                                    settings: 'minecraft:end',
                            ],
                    ],
            ],
    ])
}

