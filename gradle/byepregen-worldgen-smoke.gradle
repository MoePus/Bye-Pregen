def configureC2mefRuntimeTask = { String taskName, File root, List runtimeConfigurations ->
    tasks.matching { it.name == taskName }.configureEach {
        Map testOptions = [
                dir         : root,
                arenaPalette: 'true',
                yaLight     : 'false',
                gcFree      : 'true',
                fastTick    : 'true',
                c2meDfc     : 'false',
                seed        : "byepregen-${taskName}",
                clearWorld  : true,
        ]
        byepregenUseWorldgenTestConfig(delegate, testOptions)
        group = 'verification'
        description = 'Runs radius-16 worldgen and raw saves with the C2ME Forge port.'
        notCompatibleWithConfigurationCache('Validates a disposable C2MEF server')
        doFirst {
            delete(byepregenWorldgenResult(root))
            byepregenPrepareWorldgenRunDir(testOptions)
            byepregenInstallRuntimeMods(root, runtimeConfigurations)
        }
        doLast {
            byepregenValidateWorldgenResult(root)
            File log = file("${root}/logs/latest.log")
            String logText = log.isFile() ? log.getText('UTF-8') : ''
            List requiredLogParts = [
                    'Registered ByePregen GC-free serializer with com.ishland.c2me.base.common.registry.SerializerAccess',
                    'CAN_USE_RAW_SAVE=true',
                    'ByePregen GC-free compatibility serializer wrote raw chunk data',
            ]
            if (!requiredLogParts.every { logText.contains(it) }) {
                throw new GradleException("C2MEF raw-save compatibility was not exercised: ${log}")
            }
        }
    }
}

configureC2mefRuntimeTask('runC2mefRuntime', c2mefRuntimeRoot, [configurations.c2mefRuntime])
configureC2mefRuntimeTask(
        'runC2mefHariumRuntime',
