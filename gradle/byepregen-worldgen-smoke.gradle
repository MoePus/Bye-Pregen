def validateFastTickRuntime = { File root, File result ->
    String outcome = byepregenReadRequiredResult(result, 'Fast tick runtime')
    def requiredResultParts = [
            'PASS\n', 'fastchunkgen=true', 'harium=true', 'servercore=false',
            'iterationMixin=true', 'weatherScope=true', 'cacheSeeding=true',
            'hariumTickList=true', 'radius=16',
    ]
    if (!requiredResultParts.every { outcome.contains(it) }) {
        throw new GradleException("Fast tick runtime failed:\n${outcome}")
    }

    File log = file("${root}/logs/latest.log")
    if (!log.isFile()) {
        throw new GradleException("Fast tick runtime produced no latest.log: ${log}")
    }
    def logLines = log.readLines('UTF-8')
    def failures = logLines.findAll { line ->
        String lower = line.toLowerCase(Locale.ROOT)
        boolean byepregenLine = lower.contains('byepregen') || lower.contains('bye pregen')
        boolean failureMarker = [
                'mixin apply', 'target class', 'target method', 'not found',
                'failed injection', 'critical injection',
                'invalid mixin', 'error loading class', 'unregistered mixin', 'gate drift',
                'skipped overwrite', 'overwrite conflict', 'byepregen_fast_tick_runtime_fail',
        ].any { lower.contains(it) }
        byepregenLine && failureMarker
    }
    if (!failures.isEmpty()) {
        throw new GradleException("Fast tick runtime log contains ByePregen mixin failures:\n"
                + failures.join('\n'))
    }
    logger.lifecycle("Fast tick runtime passed:\n${outcome.trim()}")
}
