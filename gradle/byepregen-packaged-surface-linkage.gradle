import java.util.zip.ZipFile

def packagedSurfaceRoot = file('run/surface-packaged-linkage')
def packagedSurfaceResult = file("${packagedSurfaceRoot}/surface-linkage.result")
def packagedSurfaceDatapack = providers.gradleProperty('byepregenPackagedSurfaceDatapack')
def terraBlenderTestRuntime = configurations.detachedConfiguration(
        dependencies.create('curse.maven:terrablender-neoforge-940057:6054947')
)
terraBlenderTestRuntime.transitive = false

sourceSets {
    surfaceLinkageHarness {
        java.setSrcDirs(['src/surfaceLinkageHarness/java', 'src/harnessCommon/java'])
        resources.setSrcDirs(['src/surfaceLinkageHarness/resources'])
        compileClasspath += sourceSets.main.compileClasspath
    }
    surfacePackagedRun {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
}
sourceSets.surfacePackagedRun.runtimeClasspath = sourceSets.surfacePackagedRun.output +
        (sourceSets.main.runtimeClasspath - sourceSets.main.output)

configurations {
    surfaceLinkageHarnessCompileOnly.extendsFrom compileOnly
    surfaceLinkageHarnessAnnotationProcessor.extendsFrom annotationProcessor
}

def surfaceLinkageHarnessJar = tasks.register('surfaceLinkageHarnessJar', Jar) {
    group = 'verification'
    description = 'Builds the isolated NeoForge mod used by the packaged Surface linkage gate.'
    dependsOn(sourceSets.surfaceLinkageHarness.classesTaskName)
    archiveBaseName = 'byepregen-surface-linkage-harness'
    archiveVersion = '1'
    destinationDirectory = layout.buildDirectory.dir('surface-linkage')
    from(sourceSets.surfaceLinkageHarness.output)
}

def surfaceOpaqueRuntimeVerification = tasks.register('testSurfaceOpaqueRuntime') {
    group = 'verification'
    description = 'Runs opaque SurfaceRule continuation checks against generated hidden classes.'
    dependsOn('runSurfaceOpaqueRuntimeTest')
}

def surfaceOpaqueRuntimeHarnessJar = tasks.register('surfaceOpaqueRuntimeHarnessJar', Jar) {
    group = 'verification'
    description = 'Builds the isolated mod used by the transformed Surface runtime test.'
    dependsOn(sourceSets.surfaceTest.classesTaskName)
    archiveBaseName = 'byepregen-surface-runtime-test'
    archiveVersion = '1'
    destinationDirectory = layout.buildDirectory.dir('surface-runtime-test')
    from(sourceSets.surfaceTest.output) {
        include 'com/moepus/byepregen/surfacetest/**'
        include 'META-INF/neoforge.mods.toml'
    }
}
def surfaceOpaqueRuntimeHarnessFile = surfaceOpaqueRuntimeHarnessJar.flatMap { it.archiveFile }

tasks.register('compareSurfaceWorlds', JavaExec) {
    group = 'verification'
    description = 'Compares saved Surface block-state, heightmap, and postprocessing hashes.'
    dependsOn(sourceSets.surfaceTest.classesTaskName)
    classpath = sourceSets.surfaceTest.runtimeClasspath
    mainClass.set('com.moepus.byepregen.test.SurfaceWorldHash')
    args(
            providers.gradleProperty('byepregenSurfaceExpectedWorld').orElse('').get(),
            providers.gradleProperty('byepregenSurfaceActualWorld').orElse('').get()
    )
    def boundProperties = [
            minChunkX: 'byepregenSurfaceHashMinChunkX',
            maxChunkX: 'byepregenSurfaceHashMaxChunkX',
            minChunkZ: 'byepregenSurfaceHashMinChunkZ',
            maxChunkZ: 'byepregenSurfaceHashMaxChunkZ',
    ]
    boundProperties.each { suffix, propertyName ->
        def value = providers.gradleProperty(propertyName)
        if (value.present) {
            systemProperty "byepregen.surfaceHash.${suffix}", value.get()
        }
    }
    boolean completeBoundsProvided = boundProperties.values().every {
        providers.gradleProperty(it).present
    }
    systemProperty(
            'byepregen.surfaceHash.requireCompleteBounds',
            providers.gradleProperty('byepregenSurfaceHashRequireCompleteBounds')
                    .orElse(Boolean.toString(completeBoundsProvided))
                    .get()
    )
}

tasks.register('benchmarkSurfaceBiomeCache', JavaExec) {
    group = 'verification'
    description = 'Microbenchmarks flat-palette certificate hit and miss paths.'
    dependsOn(sourceSets.benchmark.classesTaskName)
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass.set('com.moepus.byepregen.test.SurfaceBiomeCacheBenchmark')
    systemProperty(
            'byepregen.surfaceBiomeCacheBenchmarkMode',
            providers.gradleProperty('byepregenSurfaceBiomeCacheBenchmarkMode').orElse('OFF').get()
    )
    systemProperty(
            'byepregen.surfaceBiomeCacheBenchmarkPattern',
            providers.gradleProperty('byepregenSurfaceBiomeCacheBenchmarkPattern').orElse('NON_UNIFORM').get()
    )
}

def productionSurfaceJar = tasks.named('jar', Jar).flatMap { it.archiveFile }
def verificationSourceSets = [
        [label: 'unit test', sourceSet: sourceSets.test],
        [label: 'benchmark', sourceSet: sourceSets.benchmark],
        [label: 'Surface test', sourceSet: sourceSets.surfaceTest],
        [label: 'Surface linkage harness', sourceSet: sourceSets.surfaceLinkageHarness],
        [label: 'worldgen harness', sourceSet: sourceSets.worldgenHarness],
        [label: 'startup harness', sourceSet: sourceSets.startupHarness],
]
def verificationClassDirectories = files(
        verificationSourceSets.collect { it.sourceSet.output.classesDirs }
)
def verificationResourceDirectories = files(
        verificationSourceSets.collect { it.sourceSet.output.resourcesDir }.findAll { it != null }
)
def verificationModIds = [
        'byepregen_surface_test',
        'byepregen_surface_linkage_test',
        'byepregen_worldgen_harness',
        'byepregen_startup_harness',
]
def verifyPackagedSurfaceJar = tasks.register('verifyPackagedSurfaceJar') {
    group = 'verification'
    description = 'Checks production runtime contents and excludes all verification harnesses.'
    dependsOn(
            tasks.named('jar'),
            verificationSourceSets.collect { it.sourceSet.classesTaskName }
    )
    inputs.file(productionSurfaceJar)
    inputs.files(verificationClassDirectories)
    inputs.files(verificationResourceDirectories)
    doLast {
        File productionJar = productionSurfaceJar.get().asFile
        new ZipFile(productionJar).withCloseable { zip ->
            [
                    'com/moepus/byepregen/worldgen/surface/SurfaceScalarAsmCompiler.class',
                    'com/moepus/byepregen/mixin/surface/SurfaceRulesLookupMixin.class',
                    'byepregen.mixins.json',
                    'META-INF/neoforge.mods.toml',
            ].each { entry ->
                if (zip.getEntry(entry) == null) {
                    throw new GradleException("Production jar is missing ${entry}: ${productionJar}")
                }
            }
            if (zip.entries().any { it.name.startsWith('com/moepus/byepregen/test/') }) {
                throw new GradleException("Production jar contains excluded test classes: ${productionJar}")
            }
            if (zip.getEntry('com/moepus/byepregen/bootstrap/TestWorldGenBootstrap.class') != null) {
                throw new GradleException("Production jar contains the worldgen test bootstrap: ${productionJar}")
            }
            def metadataEntries = zip.entries().findAll {
                it.name == 'META-INF/neoforge.mods.toml'
            }
            if (metadataEntries.size() != 1) {
                throw new GradleException(
                        "Production jar must contain exactly one NeoForge metadata entry, found " +
                                "${metadataEntries.size()}: ${productionJar}"
                )
            }
            metadataEntries.each { metadataEntry ->
                String metadata = zip.getInputStream(metadataEntry).withCloseable {
                    it.getText('UTF-8')
                }
                verificationModIds.each { modId ->
                    if (metadata.contains(modId)) {
                        throw new GradleException(
                                "Production jar contains verification mod metadata for ${modId}: ${productionJar}"
                        )
                    }
                }
            }
            verificationSourceSets.each { verification ->
                verification.sourceSet.output.classesDirs.files.each { classesDirectory ->
                    if (!classesDirectory.isDirectory()) {
                        return
                    }
                    classesDirectory.eachFileRecurse { verificationClass ->
                        if (!verificationClass.isFile() || !verificationClass.name.endsWith('.class')) {
                            return
                        }
                        String entry = classesDirectory.toPath().relativize(verificationClass.toPath())
                                .toString().replace('\\', '/')
                        if (zip.getEntry(entry) != null) {
                            throw new GradleException(
                                    "Production jar contains ${verification.label} class " +
                                            "${entry}: ${productionJar}"
                            )
                        }
                    }
                }
                File resourcesDirectory = verification.sourceSet.output.resourcesDir
                if (resourcesDirectory != null && resourcesDirectory.isDirectory()) {
                    resourcesDirectory.eachFileRecurse { verificationResource ->
                        if (!verificationResource.isFile()) {
                            return
                        }
                        String entry = resourcesDirectory.toPath().relativize(verificationResource.toPath())
                                .toString().replace('\\', '/')
                        if (entry != 'META-INF/neoforge.mods.toml' && zip.getEntry(entry) != null) {
                            throw new GradleException(
                                    "Production jar contains ${verification.label} resource " +
                                            "${entry}: ${productionJar}"
                            )
                        }
                    }
                }
            }
        }
    }
}

def preparePackagedSurfaceLinkage = tasks.register('preparePackagedSurfaceLinkage') {
    group = 'verification'
    description = 'Prepares a disposable server containing only packaged test mods.'
    dependsOn(verifyPackagedSurfaceJar, surfaceLinkageHarnessJar)
    notCompatibleWithConfigurationCache('Prepares a disposable packaged NeoForge server directory')
    doLast {
        delete(packagedSurfaceRoot)
        file("${packagedSurfaceRoot}/mods").mkdirs()
        copy {
            from(tasks.named('jar', Jar).flatMap { it.archiveFile })
            from(surfaceLinkageHarnessJar.flatMap { it.archiveFile })
            into(file("${packagedSurfaceRoot}/mods"))
        }
        if (packagedSurfaceDatapack.present) {
            File datapack = file(packagedSurfaceDatapack.get())
            if (!datapack.isFile()) {
                throw new GradleException("Surface linkage datapack does not exist: ${datapack}")
            }
            copy {
                from(datapack)
                into(file("${packagedSurfaceRoot}/world/datapacks"))
            }
        }

        prepareDisposableServer([
                directory: packagedSurfaceRoot,
                serverProperties: [
                        'level-name'         : 'world',
                        'level-seed'         : 'byepregen-packaged-surface-linkage',
                        'online-mode'        : false,
                        'server-port'        : 25569,
                        'max-tick-time'      : 0,
                        'view-distance'      : 2,
                        'simulation-distance': 2,
                        'spawn-protection'   : 0,
                ],
                byepregenConfig: [
                        debugDisableFeatures          : true,
                        enablePlacedFeatureMixin      : false,
                        enableArenaPalette            : false,
                        enableServerRuntimeArenaPalette: false,
                        enableYALightEngine           : false,
                        enableGcFreeWorldgenSave      : false,
                        enableSurfaceRuleCompiler     : true,
                ],
        ])
    }
}

neoForge {
    runs {
        surfaceOpaqueRuntimeTest {
            server()
            loadedMods.set([neoForge.mods.named(project.mod_id).get()] as Set)
            gameDirectory = file('run/surface-opaque-runtime-test')
            programArgument '--nogui'
            systemProperty 'byepregen.surfaceScalar', 'true'
            systemProperty 'byepregen.surfaceOpaqueRuntimeTest', 'true'
            taskBefore(surfaceOpaqueRuntimeHarnessJar)
            logLevel = org.slf4j.event.Level.INFO
        }

        surfacePackagedLinkage {
            server()
            disableIdeRun()
            loadedMods.set([] as Set)
            sourceSet.set(sourceSets.surfacePackagedRun)
            gameDirectory = packagedSurfaceRoot
            programArgument '--nogui'
            systemProperty 'byepregen.surfaceOutputDifferential', 'false'
            systemProperty 'byepregen.surfaceBiomeCache', 'true'
            systemProperty 'byepregen.surfaceLinkageResult', packagedSurfaceResult.absolutePath
            systemProperty 'neoforge.enabledGameTestNamespaces', ''
            jvmArgument("-Djava.io.tmpdir=${file("${packagedSurfaceRoot}/tmp").absolutePath.replace('\\', '/')}")
            logLevel = org.slf4j.event.Level.INFO
            taskBefore(preparePackagedSurfaceLinkage)
        }
    }
}

tasks.named('runSurfaceOpaqueRuntimeTest', JavaExec) {
    javaLauncher.set(byepregenRunJavaLauncher)
    notCompatibleWithConfigurationCache('Prepares a disposable runtime-test server directory')
    doFirst {
        def runDirectory = file('run/surface-opaque-runtime-test')
        def modsDirectory = file("${runDirectory}/mods")
        delete(modsDirectory)
        modsDirectory.mkdirs()
        copy {
            from(surfaceOpaqueRuntimeHarnessFile)
            from(terraBlenderTestRuntime)
            into(modsDirectory)
        }
        prepareDisposableServer([
                directory: runDirectory,
                byepregenConfig: [
                        enableArenaPalette      : false,
                        enableGcFreeWorldgenSave: false,
                        enableYALightEngine     : false,
                ],
        ])
    }
}

tasks.matching { it.name == 'runSurfacePackagedLinkage' }.configureEach {
    group = 'verification'
    description = 'Loads the production jar in NeoForge and executes generated Surface scalar bytecode.'
    notCompatibleWithConfigurationCache('Validates a result produced by a disposable packaged server')
    doLast {
        String result = byepregenAssertPassResult(packagedSurfaceResult, 'Packaged Surface linkage harness')
        logger.lifecycle("Packaged Surface linkage passed:\n${result.trim()}")
    }
}

tasks.named('check') {
    dependsOn(verifyPackagedSurfaceJar)
}
