import groovy.json.JsonOutput
import java.nio.charset.StandardCharsets

ext.writeUtf8File = { File target, String content ->
    target.parentFile?.mkdirs()
    target.setText(content, StandardCharsets.UTF_8.name())
}

ext.writeJsonFile = { File target, Map<String, ?> value ->
    writeUtf8File(target, JsonOutput.prettyPrint(JsonOutput.toJson(value)) + '\n')
}

ext.byepregenReadRequiredResult = { File result, String label ->
    if (!result.isFile()) {
        throw new GradleException("${label} produced no result: ${result}")
    }
    result.getText(StandardCharsets.UTF_8.name())
}

ext.byepregenAssertPassResult = { File result, String label ->
    String value = byepregenReadRequiredResult(result, label)
    if (!value.startsWith('PASS\n')) {
        throw new GradleException("${label} failed:\n${value}")
    }
    value
}

ext.byepregenAssertNoTestConfigFile = { File directory ->
    File configFile = file("${directory}/config/byepregen.toml")
    if (configFile.exists()) {
        throw new GradleException("Test run unexpectedly created ByePregen config: ${configFile}")
    }
}

ext.prepareDisposableServer = { Map<String, ?> options ->
    File directory = options.directory as File
    directory.mkdirs()
    file("${directory}/config").mkdirs()
    file("${directory}/tmp").mkdirs()
    delete(file("${directory}/config/byepregen.toml"))

    writeUtf8File(file("${directory}/eula.txt"), 'eula=true\n')
    Map<String, ?> serverProperties = ['server-port': 0] +
            ((options.serverProperties ?: [:]) as Map<String, ?>)
    if (!serverProperties.isEmpty()) {
        String properties = serverProperties
                .collect { key, value -> "${key}=${value}" }
                .join('\n')
        writeUtf8File(file("${directory}/server.properties"), properties + '\n')
    }
    if (options.chunkyConfig != null) {
        writeJsonFile(file("${directory}/config/chunky/config.json"), options.chunkyConfig as Map<String, ?>)
    }
}

ext.byepregenInstallRuntimeMods = { File directory, List runtimeConfigurations ->
    File mods = file("${directory}/mods")
    delete(mods)
    mods.mkdirs()
    copy {
        from runtimeConfigurations
        into mods
    }
}
