        root      : file('run/light-restart-raw'),
        gcFree    : 'true',
        prepareRun: 'runLightRestartRawPrepare',
        verifyRun : 'runLightRestartRawVerify',
        secondRun : 'runLightRestartRawVerifyAgain',
]
def lightRestartConfigs = [lightRestartStandard, lightRestartRaw]
lightRestartConfigs.each { config ->
    config.result = file("${config.root}/light-restart.result")
    config.baseline = file("${config.root}/light-restart.baseline")
    config.world = file("${config.root}/world")
