tasks.register('prepareLightGoldenRelight', JavaExec) {
    group = 'verification'
    description = 'Copies one source terrain world into vanilla/YA worlds and strips saved light data.'
    dependsOn('runLightGoldenSource')
    classpath = sourceSets.worldgenHarness.runtimeClasspath
    mainClass.set('com.moepus.byepregen.test.LightGoldenPrepareRelight')
    args file("${lightGoldenConfig.sourceDir}/world").absolutePath,
            file("${lightGoldenConfig.vanillaDir}/world").absolutePath,
            file("${lightGoldenConfig.yaDir}/world").absolutePath,
            file("${lightGoldenConfig.luxDir}/world").absolutePath
    systemProperty 'byepregen.lightGolden.prepareRadius', lightGoldenConfig.relightRadius
    doFirst {
        [
                [dir: lightGoldenConfig.vanillaDir, yaLight: 'false', arenaPalette: lightGoldenConfig.vanillaArena],
                [dir: lightGoldenConfig.yaDir, yaLight: 'true', arenaPalette: lightGoldenConfig.yaArena],
                [dir: lightGoldenConfig.luxDir, yaLight: 'false', arenaPalette: lightGoldenConfig.vanillaArena],
        ].each { options ->
            byepregenPrepareWorldgenRunDir(options + [gcFree: lightGoldenConfig.gcFree, clearWorld: false])
        }
    }
}

