def lightFuzzConfig = [
        sourceDir  : file("${lightFuzzRoot}/source"),
        vanillaDir: file("${lightFuzzRoot}/vanilla"),
        yaDir     : file("${lightFuzzRoot}/ya"),
        seed      : byepregenProp('byepregenLightFuzzSeed', '0x59A11E71C0DE'),
        variant   : byepregenProp('byepregenLightFuzzVariant', 'default'),
        probes    : byepregenProp('byepregenLightFuzzProbes', 'false'),
        minChunkX : byepregenProp('byepregenLightFuzzDiffMinChunkX', '-2'),
        maxChunkX : byepregenProp('byepregenLightFuzzDiffMaxChunkX', '2'),
        minChunkZ : byepregenProp('byepregenLightFuzzDiffMinChunkZ', '-2'),
        maxChunkZ : byepregenProp('byepregenLightFuzzDiffMaxChunkZ', '2'),
]
lightFuzzConfig.minChunkCoverage = byepregenProp(
        'byepregenLightFuzzMinChunkCoverage',
        lightFuzzConfig.variant == 'blackout' ? '0.5' : lightGoldenConfig.minChunkCoverage
)
lightFuzzConfig.sourceRadius = byepregenProp(
        'byepregenLightFuzzSourceRadius',
        lightFuzzConfig.variant == 'blackout' ? '256' : '64'
)
def configureLightFuzzRun = { run, File dir ->
    byepregenConfigureWorldgenRun(run, [dir: dir, mode: 'light_fuzz'])
    run.systemProperty('byepregen.testWorldGen.lightFuzzSeed', lightFuzzConfig.seed)
    run.systemProperty('byepregen.testWorldGen.lightFuzzVariant', lightFuzzConfig.variant)
    run.systemProperty('byepregen.testWorldGen.lightFuzzProbes', lightFuzzConfig.probes)
}

def configureLightRestartRun = { run, Map config, String phase ->
    byepregenConfigureWorldgenRun(run, [dir: config.root, mode: 'light_restart'])
    run.systemProperty('byepregen.testWorldGen.phase', phase)
    run.systemProperty('byepregen.testWorldGen.result', config.result.absolutePath)
    run.systemProperty('byepregen.testWorldGen.baseline', config.baseline.absolutePath)
}

def configureLightRelightRun = { run, Map options ->
    Map runOptions = [dir: options.dir, radius: lightGoldenConfig.radius, mode: 'relight']
    if (options.yaSchedulerWakeOnAdd != null) {
        runOptions.yaSchedulerWakeOnAdd = options.yaSchedulerWakeOnAdd
    }
    if (options.jfrEnabled) {
        runOptions.jfrFile = options.jfrFile
        runOptions.jfrRepository = lightGoldenConfig.relightJfrRepository
    }
    byepregenConfigureWorldgenRun(run, runOptions)
}

def configureLightDiffProperties = { JavaExec task, Map options ->
    task.systemProperty 'byepregen.lightGolden.maxMismatches', lightGoldenConfig.maxMismatches
    task.systemProperty 'byepregen.lightGolden.minComparedLayers', lightGoldenConfig.minComparedLayers
    task.systemProperty 'byepregen.lightGolden.missingAsZero', lightGoldenConfig.missingAsZero
    task.systemProperty 'byepregen.lightGolden.requireCompleteChunks', lightGoldenConfig.requireCompleteChunks
    task.systemProperty 'byepregen.lightGolden.minChunkCoverage', options.minChunkCoverage
    task.systemProperty 'byepregen.lightGolden.minChunkX', options.minChunkX
    task.systemProperty 'byepregen.lightGolden.maxChunkX', options.maxChunkX
    task.systemProperty 'byepregen.lightGolden.minChunkZ', options.minChunkZ
    task.systemProperty 'byepregen.lightGolden.maxChunkZ', options.maxChunkZ
}

def prepareRelightRunTask = { String taskName, Map options ->
    Map testOptions = [
            dir         : options.dir,
            yaLight     : options.yaLight,
            arenaPalette: options.arenaPalette,
            gcFree      : lightGoldenConfig.gcFree,
            clearWorld  : false,
    ]
    tasks.matching { it.name == taskName }.configureEach {
        byepregenUseWorldgenTestConfig(delegate, testOptions)
        notCompatibleWithConfigurationCache(options.reason)
        dependsOn('prepareLightGoldenRelight')
        if (options.mustRunAfter != null) {
            mustRunAfter(options.mustRunAfter)
        }
        doFirst {
            if (options.jfrEnabled) {
                delete(options.jfrFile)
                options.jfrFile.parentFile.mkdirs()
                lightGoldenConfig.relightJfrRepository.mkdirs()
            }
            byepregenPrepareWorldgenRunDir(testOptions)
            if (options.modFiles != null) {
                copy {
                    from options.modFiles
                    into file("${options.dir}/mods")
                }
            }
        }
    }
    byepregenConfigureWorldgenResultTask(taskName, options.dir)
}

