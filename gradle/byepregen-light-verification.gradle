def assertLightRestartResult = { Map config, String expected ->
    String result = byepregenReadRequiredResult(config.result, 'Light restart probe').trim()
    byepregenAssertNoTestConfigFile(config.root)
    if (result != expected) {
        throw new GradleException("Light restart probe failed: ${result}")
    }
    if (config.gcFree.toBoolean()) {
        File log = file("${config.root}/logs/latest.log")
        String text = log.isFile() ? log.getText('UTF-8') : ''
        if (!text.contains('Registered ByePregen GC-free worldgen chunk serializer with C2ME')
                || !text.contains('CAN_USE_RAW_SAVE=true')) {
            throw new GradleException("C2ME raw serializer was not exercised: ${log}")
        }
    }
}

def configureLightRestartServerTask = { Map options ->
    Map config = options.config
    Map testOptions = [
            dir         : config.root,
            yaLight     : 'true',
            gcFree      : config.gcFree,
            clearWorld  : options.prepare,
            flatWorld   : true,
            arenaPalette: 'false',
    ]
    tasks.matching { it.name == options.taskName }.configureEach {
        byepregenUseWorldgenTestConfig(delegate, testOptions)
        notCompatibleWithConfigurationCache('Creates or reuses a restart fixture')
        if (options.prerequisite != null) {
            dependsOn(options.prerequisite)
        }
        doFirst {
            if (options.prepare) {
                delete(config.root)
            } else {
                delete(config.result)
            }
            byepregenPrepareWorldgenRunDir(testOptions)
        }
        doLast {
            assertLightRestartResult(config, options.prepare ? 'PREPARED' : 'PASS')
        }
    }
}

def registerLightRestartDiskTask = { Map options ->
    tasks.register(options.taskName, JavaExec) {
        group = 'verification'
        dependsOn(options.prerequisite)
        classpath = sourceSets.worldgenHarness.runtimeClasspath
        mainClass.set('com.moepus.byepregen.test.LightRestartDiskVerifier')
        args options.config.world.absolutePath, options.relightLightOn.toString()
    }
}

lightRestartConfigs.each { config ->
    String preparedDisk = "verifyLightRestart${config.id}PreparedDisk"
    String firstDisk = "verifyLightRestart${config.id}FirstDisk"
    String secondDisk = "verifyLightRestart${config.id}SecondDisk"
    [
            [run: config.prepareRun, prepare: true, prerequisite: null, disk: preparedDisk, lightOn: false],
            [run: config.verifyRun, prepare: false, prerequisite: preparedDisk, disk: firstDisk, lightOn: true],
            [run: config.secondRun, prepare: false, prerequisite: firstDisk, disk: secondDisk, lightOn: true],
    ].each { stage ->
        configureLightRestartServerTask([
                taskName    : stage.run,
                config      : config,
                prepare     : stage.prepare,
                prerequisite: stage.prerequisite,
        ])
        registerLightRestartDiskTask([
                taskName      : stage.disk,
                prerequisite  : stage.run,
                config        : config,
                relightLightOn: stage.lightOn,
        ])
    }
    config.finalDiskTask = secondDisk
}

tasks.matching { it.name == lightRestartRaw.prepareRun }.configureEach {
