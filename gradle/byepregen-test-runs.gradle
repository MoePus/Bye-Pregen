def prop = { String name, String fallback ->
    providers.gradleProperty(name).orElse(fallback).get()
}

def slashPath = { File value ->
    value.absolutePath.replace('\\', '/')
}

def sanitizeRunName = { String value ->
    value.replaceAll('[^0-9A-Za-z._-]', '_')
}

def jfrSettings = prop('byepregenJfrSettings', 'profile')

def worldGenConfig = [
        dir    : file(prop('byepregenTestWorldGenDir', 'run/test-worldgen')),
        radius : prop('byepregenTestWorldGenRadius', '700'),
        seed   : prop('byepregenTestWorldGenSeed', 'byepregen-test-worldgen'),
        gcFree : prop('byepregenTestWorldGenGcFree', 'true'),
        yaLight: prop('byepregenTestWorldGenYALight', 'true'),
        surfaceBiomeCache: prop('byepregenTestSurfaceBiomeCache', 'true'),
        surfaceScalar: prop('byepregenTestSurfaceScalar', 'true'),
        surfaceOutputDifferential: providers.gradleProperty('byepregenTestSurfaceOutputDifferential')
                .orElse(providers.gradleProperty('byepregenTestSurfaceDifferential'))
                .orElse('false')
                .get(),
        noFeatures: prop('byepregenTestWorldGenNoFeatures', 'false'),
        levelType: prop('byepregenTestWorldGenLevelType', 'minecraft:normal'),
        enablePlacedFeatureMixin: prop('byepregenTestEnablePlacedFeatureMixin', 'false'),
        logCompilation: prop('byepregenTestLogCompilation', 'false').toBoolean(),
        surfaceBiomeProfile: prop('byepregenTestSurfaceBiomeProfile', 'false'),
        datapack: providers.gradleProperty('byepregenTestWorldGenDatapack').orNull,
