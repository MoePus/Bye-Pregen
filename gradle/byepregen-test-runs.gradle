        minComparedLayers: prop('byepregenLightGoldenMinComparedLayers', '1'),
        missingAsZero    : prop('byepregenLightGoldenMissingAsZero', 'false'),
        sourceArena      : prop('byepregenLightGoldenSourceArenaPalette', 'true'),
        vanillaArena     : prop('byepregenLightGoldenVanillaArenaPalette', 'true'),
