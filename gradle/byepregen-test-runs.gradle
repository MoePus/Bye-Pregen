        yaDir     : file("${lightFuzzRoot}/ya"),
        seed      : prop('byepregenLightFuzzSeed', '0x59A11E71C0DE'),
        variant   : prop('byepregenLightFuzzVariant', 'default'),
        probes    : prop('byepregenLightFuzzProbes', 'false'),
        minChunkX : prop('byepregenLightFuzzDiffMinChunkX', '-8'),
        maxChunkX : prop('byepregenLightFuzzDiffMaxChunkX', '8'),
        minChunkZ : prop('byepregenLightFuzzDiffMinChunkZ', '-8'),
        maxChunkZ : prop('byepregenLightFuzzDiffMaxChunkZ', '8'),
]

def configureWorldgenRun = { run, Map options ->
    run.server()
    run.sourceSet.set(sourceSets.worldgenHarness)
    run.loadedMods.set([
            neoForge.mods.named(project.mod_id).get(),
            neoForge.mods.named('byepregen_worldgen_harness').get(),
    ] as Set)
    run.gameDirectory = options.dir
    run.programArgument('--nogui')
    run.systemProperty('byepregen.testWorldGen', 'true')
    run.systemProperty('byepregen.surfaceBiomeCache', options.surfaceBiomeCache ?: 'true')
    run.systemProperty(
            'byepregen.surfaceOutputDifferential',
            options.surfaceOutputDifferential ?: 'false'
    )
    run.systemProperty('byepregen.surfaceBiomeCacheProfile', options.surfaceBiomeProfile ?: 'false')
    run.systemProperty('neoforge.enabledGameTestNamespaces', project.mod_id)
    run.logLevel = org.slf4j.event.Level.INFO
    run.jvmArgument("-Djava.io.tmpdir=${slashPath(file("${options.dir}/tmp"))}")

    if (options.radius != null) {
        run.systemProperty('byepregen.testWorldGen.radius', options.radius)
    }
    if (options.mode != null) {
        run.systemProperty('byepregen.testWorldGen.mode', options.mode)
    }
    if (options.yaSchedulerWakeOnAdd != null) {
        run.systemProperty('byepregen.yaLightSchedulerWakeOnAdd', options.yaSchedulerWakeOnAdd)
    }
    if (options.jfrFile != null) {
        run.jvmArgument("-XX:FlightRecorderOptions=stackdepth=128,repository=${slashPath(options.jfrRepository)}")
        run.jvmArgument("-XX:StartFlightRecording=filename=${slashPath(options.jfrFile)},settings=${jfrSettings},dumponexit=true")
    }
    if (options.compilationLog != null) {
        run.jvmArgument('-XX:+UnlockDiagnosticVMOptions')
        run.jvmArgument('-XX:+LogCompilation')
        run.jvmArgument("-XX:LogFile=${slashPath(options.compilationLog)}")
    }
}

def configureLightFuzzRun = { run, File dir ->
    configureWorldgenRun(run, [dir: dir, mode: 'light_fuzz'])
    run.systemProperty('byepregen.testWorldGen.lightFuzzSeed', lightFuzzConfig.seed)
    run.systemProperty('byepregen.testWorldGen.lightFuzzVariant', lightFuzzConfig.variant)
    run.systemProperty('byepregen.testWorldGen.lightFuzzProbes', lightFuzzConfig.probes)
}

def prepareWorldGenRunDir = { Map options ->
    File dir = options.dir
    String arenaPalette = options.get('arenaPalette') ?: 'true'
    String serverRuntimeArenaPalette = options.get('serverRuntimeArenaPalette') ?: options.get('yaLight') ?: 'false'
    if (options.clearWorld) {
        delete(file("${dir}/world"))
    }
    dir.mkdirs()
    file("${dir}/config/chunky").mkdirs()
    file("${dir}/tmp").mkdirs()
    file("${dir}/eula.txt").text = "eula=true\n"
    file("${dir}/config/byepregen.json").text = """\
{
  "debugDisableFeatures": ${options.noFeatures ?: 'false'},
  "enablePlacedFeatureMixin": ${options.enablePlacedFeatureMixin ?: 'false'},
  "enableArenaPalette": ${arenaPalette},
  "enableServerRuntimeArenaPalette": ${serverRuntimeArenaPalette},
  "enableYALightEngine": ${options.yaLight},
  "enableGcFreeWorldgenSave": ${options.gcFree},
  "enableSurfaceRuleCompiler": ${options.surfaceScalar ?: 'true'}
}
""".stripIndent()
    file("${dir}/config/chunky/config.json").text = """\
{
  "version": 2,
  "language": "en",
  "continueOnRestart": false,
  "forceLoadExistingChunks": true,
  "silent": false,
  "updateInterval": 1
}
""".stripIndent()
    file("${dir}/server.properties").text = """\
level-seed=${options.seed ?: 'byepregen-test-worldgen'}
level-name=world
online-mode=false
max-tick-time=0
view-distance=2
simulation-distance=2
enable-command-block=false
spawn-protection=0
level-type=${options.levelType ?: (options.flatWorld ? 'minecraft:flat' : 'minecraft:normal')}
""".stripIndent()
}

def prepareRunTask = { String taskName, Map options ->
    tasks.matching { it.name == taskName }.configureEach {
        notCompatibleWithConfigurationCache(options.reason)
        if (options.mustRunAfter != null) {
            mustRunAfter(options.mustRunAfter)
        }
        doFirst {
            prepareWorldGenRunDir(options.prepare)
        }
    }
}

def prepareRelightRunTask = { String taskName, Map options ->
    tasks.matching { it.name == taskName }.configureEach {
        notCompatibleWithConfigurationCache(options.reason)
        dependsOn('prepareLightGoldenRelight')
        if (options.mustRunAfter != null) {
            mustRunAfter(options.mustRunAfter)
        }
        doFirst {
            if (options.jfrEnabled) {
                delete(options.jfrFile)
                options.jfrFile.parentFile.mkdirs()
                lightGoldenConfig.relightJfrRepository.mkdirs()
            }
            prepareWorldGenRunDir([
                    dir         : options.dir,
                    yaLight     : options.yaLight,
                    arenaPalette: options.arenaPalette,
                    gcFree      : lightGoldenConfig.gcFree,
                    clearWorld  : false,
            ])
            if (options.modFiles != null) {
                copy {
                    from options.modFiles
                    into file("${options.dir}/mods")
                }
            }
        }
    }
}

neoForge {
    runs {
        testWorldGen {
            configureWorldgenRun(delegate, [
                    dir          : worldGenConfig.dir,
                    radius       : worldGenConfig.radius,
                    jfrFile      : worldGenConfig.jfr,
                    jfrRepository: worldGenConfig.jfrRepository,
                    surfaceBiomeCache: worldGenConfig.surfaceBiomeCache,
                    surfaceScalar: worldGenConfig.surfaceScalar,
                    surfaceOutputDifferential: worldGenConfig.surfaceOutputDifferential,
                    surfaceBiomeProfile: worldGenConfig.surfaceBiomeProfile,
                    enablePlacedFeatureMixin: worldGenConfig.enablePlacedFeatureMixin,
                    compilationLog: worldGenConfig.logCompilation ? worldGenConfig.compilationLog : null,
            ])
        }

        lightGoldenSource {
            configureWorldgenRun(delegate, [dir: lightGoldenConfig.sourceDir, radius: lightGoldenConfig.sourceRadius])
        }

        lightGoldenVanilla {
            configureWorldgenRun(delegate, [dir: lightGoldenConfig.vanillaDir, radius: lightGoldenConfig.radius])
        }

        lightGoldenYA {
            configureWorldgenRun(delegate, [dir: lightGoldenConfig.yaDir, radius: lightGoldenConfig.radius])
        }

        lightGoldenRelightVanilla {
            def runOptions = [dir: lightGoldenConfig.vanillaDir, radius: lightGoldenConfig.radius, mode: 'relight']
            if (lightGoldenConfig.relightVanillaJfrEnabled) {
                runOptions.jfrFile = lightGoldenConfig.relightVanillaJfr
                runOptions.jfrRepository = lightGoldenConfig.relightJfrRepository
            }
            configureWorldgenRun(delegate, runOptions)
        }

        lightGoldenRelightYA {
            def runOptions = [
                    dir             : lightGoldenConfig.yaDir,
                    radius          : lightGoldenConfig.radius,
                    mode            : 'relight',
                    yaSchedulerWakeOnAdd: lightGoldenConfig.yaSchedulerWakeOnAdd,
            ]
            if (lightGoldenConfig.relightYAJfrEnabled) {
                runOptions.jfrFile = lightGoldenConfig.relightYAJfr
                runOptions.jfrRepository = lightGoldenConfig.relightJfrRepository
            }
            configureWorldgenRun(delegate, runOptions)
        }

        lightGoldenRelightLux {
            def runOptions = [dir: lightGoldenConfig.luxDir, radius: lightGoldenConfig.radius, mode: 'relight']
            if (lightGoldenConfig.relightLuxJfrEnabled) {
                runOptions.jfrFile = lightGoldenConfig.relightLuxJfr
                runOptions.jfrRepository = lightGoldenConfig.relightJfrRepository
            }
            configureWorldgenRun(delegate, runOptions)
        }

        lightFuzzVanilla {
            configureLightFuzzRun(delegate, lightFuzzConfig.vanillaDir)
        }

        lightFuzzYA {
            configureLightFuzzRun(delegate, lightFuzzConfig.yaDir)
        }
    }
}

tasks.matching { it.name == 'runTestWorldGen' }.configureEach {
    notCompatibleWithConfigurationCache('Prepares a disposable test world before launching the server')
    doFirst {
        delete(worldGenConfig.jfr)
        if (worldGenConfig.logCompilation) {
            delete(worldGenConfig.compilationLog)
            worldGenConfig.compilationLog.parentFile.mkdirs()
        }
        worldGenConfig.jfrRepository.mkdirs()
        worldGenConfig.tmpDir.mkdirs()
        prepareWorldGenRunDir([
                dir       : worldGenConfig.dir,
                yaLight   : worldGenConfig.yaLight,
                gcFree    : worldGenConfig.gcFree,
                seed      : worldGenConfig.seed,
                noFeatures: worldGenConfig.noFeatures,
                levelType : worldGenConfig.levelType,
                enablePlacedFeatureMixin: worldGenConfig.enablePlacedFeatureMixin,
                clearWorld: true,
        ])
        if (worldGenConfig.datapack != null) {
            copy {
                from file(worldGenConfig.datapack)
                into file("${worldGenConfig.dir}/world/datapacks")
            }
        }
    }
}

