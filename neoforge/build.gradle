plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

repositories {
    mavenCentral()
    maven { url = 'https://moepus.github.io/MixinLite/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven {
        name = 'Sinytra'
        url = 'https://maven.sinytra.org/'
    }
}

sourceSets {
    startupHarness {
        java.setSrcDirs(['src/startupHarness/java', project(':common').file('src/harnessCommon/java')])
        resources.setSrcDirs(['src/startupHarness/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    surfaceLinkageHarness {
        java.setSrcDirs(['src/surfaceLinkageHarness/java', project(':common').file('src/harnessCommon/java')])
        resources.setSrcDirs(['src/surfaceLinkageHarness/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    surfacePackagedRun {
        java.setSrcDirs([])
        resources.setSrcDirs([])
    }
    surfaceTest {
        java.setSrcDirs(['src/surfaceTest/java', project(':common').file('src/harnessCommon/java')])
        resources.setSrcDirs(['src/surfaceTest/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    worldgenHarness {
        java.setSrcDirs(['src/worldgenHarness/java', project(':common').file('src/harnessCommon/java')])
        // The density column and climate column probes were written against the removed per-column
        // codegen; the float sampler port replaces them with the Fabric-side DFC verification.
        java.exclude('**/test/DensityColumn*.java')
        java.exclude('**/test/ClimateRTreeColumnProbe.java')
        resources.setSrcDirs(['src/worldgenHarness/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    benchmark {
        java.setSrcDirs(['src/benchmark/java'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

configurations {
    startupHarnessCompileOnly.extendsFrom(compileOnly)
    startupHarnessAnnotationProcessor.extendsFrom(annotationProcessor)
    surfaceLinkageHarnessCompileOnly.extendsFrom(compileOnly)
    surfaceLinkageHarnessAnnotationProcessor.extendsFrom(annotationProcessor)
    surfaceTestCompileOnly.extendsFrom(compileOnly)
    surfaceTestAnnotationProcessor.extendsFrom(annotationProcessor)
    worldgenHarnessCompileOnly.extendsFrom(compileOnly)
    worldgenHarnessAnnotationProcessor.extendsFrom(annotationProcessor)
    benchmarkCompileOnly.extendsFrom(compileOnly)
    benchmarkAnnotationProcessor.extendsFrom(annotationProcessor)
}

def runJavaVersion = providers.gradleProperty('byepregenRunJavaVersion')
        .map(Integer::parseInt)
        .orElse(java_version as int)
ext.byepregenRunJavaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(runJavaVersion.get())
}

neoForge {
    enable {
        version = neoforge_version
        disableRecompilation = true
    }
    def accessTransformer = project(':common').file('src/main/resources/META-INF/arena-core.cfg')
    if (accessTransformer.exists()) {
        accessTransformers.from(accessTransformer.absolutePath)
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(project(':common').sourceSets.main)
        }
        byepregen_startup_harness {
            sourceSet(sourceSets.startupHarness)
        }
        byepregen_worldgen_harness {
            sourceSet(sourceSets.worldgenHarness)
        }
        // TODO(26.3): Register the surface test mod after its TerraBlender and light dependencies migrate.
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${name.capitalize()} (${project.path})"
        }
        client {
            client()
            loadedMods.set([neoForge.mods.named(mod_id).get()] as Set)
            gameDirectory = file('runs/client')
        }
        server {
            server()
            loadedMods.set([neoForge.mods.named(mod_id).get()] as Set)
            gameDirectory = file('runs/server')
            programArgument '--nogui'
        }
    }
}

def worldgenValidationTasks = [
        'runTestWorldGen', 'runtimeCheck', 'ciCheck',
        'runArenaPaletteDifferential', 'testArenaPaletteDifferential',
        'runChunkNbtParity', 'testChunkNbtParity',
        'runFastTickRuntime', 'testFastTickRuntime',
]
def requestedValidationTasks = gradle.startParameter.taskNames.collect {
    it.tokenize(':').last()
}
def worldgenValidationRequested = requestedValidationTasks.any {
    it in worldgenValidationTasks
            || it.startsWith('runLight')
            || it.startsWith('testYALight')
            || it.startsWith('prepareLight')
            || it.startsWith('diffLight')
            || it.startsWith('verifyLight')
}
def fastTickRuntimeRequested = requestedValidationTasks.any {
    it in ['runFastTickRuntime', 'testFastTickRuntime', 'runtimeCheck', 'ciCheck']
}
def optionalRuntimeEnabled = providers.gradleProperty('byepregen.enableOptionalRuntime')
        .map(String::toBoolean)
        .orElse(false)
        .get()

dependencies {
    implementation("org.mixinlite:mixinlite:${mixinlite_version}")
    annotationProcessor("org.mixinlite:mixinlite:${mixinlite_version}")
    jarJar("org.mixinlite:mixinlite:${mixinlite_version}")
    // TODO(26.3): Restore after the mod and its compatibility code support this version.
    // compileOnly("maven.modrinth:terrablender:${terrablender_neoforge_version}")

    if (optionalRuntimeEnabled) {
        runtimeOnly("maven.modrinth:c2me-neoforge:${c2me_neoforge_version}")
        runtimeOnly("maven.modrinth:lithium:${lithium_neoforge_version}")
        runtimeOnly("maven.modrinth:architectury-api:${architectury_neoforge_version}")
        runtimeOnly("maven.modrinth:chunky:${chunky_neoforge_version}")
        // Sodium ships a 26.3 build, so the palette contract surface is exercised against it again.
        runtimeOnly("maven.modrinth:sodium:${sodium_neoforge_version}")
        // TODO(26.3): Restore FastNoise and TerraBlender compatibility when they update.
        // FastNoise is runtime-only here (never a compile input): enable this line to run the runtime
        // checks with it installed, once a build for this Minecraft version exists.
        // runtimeOnly("maven.modrinth:zfastnoise:${zfastnoise_neoforge_version}")
    } else if (worldgenValidationRequested) {
        runtimeOnly("maven.modrinth:c2me-neoforge:${c2me_neoforge_version}")
        runtimeOnly("maven.modrinth:chunky:${chunky_neoforge_version}")
        if (fastTickRuntimeRequested) {
            runtimeOnly("maven.modrinth:lithium:${lithium_neoforge_version}")
        }
    }

}

apply from: rootProject.file('gradle/byepregen-test-config.gradle')
apply from: rootProject.file('gradle/byepregen-server-fixtures.gradle')
apply from: rootProject.file('gradle/byepregen-worldgen-run-support.gradle')
apply from: rootProject.file('gradle/byepregen-startup-verification.gradle')
apply from: rootProject.file('gradle/byepregen-worldgen-smoke.gradle')
apply from: rootProject.file('gradle/byepregen-light-verification.gradle')

// GC-free saving is off by default; opt the startup check into it so the NeoForge save gate and the
// C2ME raw-IO branch are exercised when the optional runtime mods are installed.
if (providers.gradleProperty('byepregen.startupGcFreeWorldgen').map(String::toBoolean).orElse(false).get()) {
    neoForge.runs.named('startupServer') {
        systemProperty 'byepregen.testConfig.chunk-saving.gc-free-worldgen', 'True'
    }
}
// The Arena client palette and the retained server-side Arena storage are both off by default, so the
// ordinary startup checks never load their mixins; these switches let them do so on demand.
if (providers.gradleProperty('byepregen.startupClientArena').map(String::toBoolean).orElse(false).get()) {
    neoForge.runs.named('startupClient') {
        systemProperty 'byepregen.testConfig.worldgen.arena.client', 'True'
    }
}
if (providers.gradleProperty('byepregen.startupServerArena').map(String::toBoolean).orElse(false).get()) {
    neoForge.runs.named('startupServer') {
        systemProperty 'byepregen.testConfig.worldgen.arena.server-runtime', 'True'
    }
}
// YA light is off by default; the start-up checks can load its mixins, including the client-side ones.
if (providers.gradleProperty('byepregen.startupYaLight').map(String::toBoolean).orElse(false).get()) {
    neoForge.runs.named('startupServer') {
        systemProperty 'byepregen.testConfig.lighting.ya.enabled', 'True'
    }
    neoForge.runs.named('startupClient') {
        systemProperty 'byepregen.testConfig.lighting.ya.enabled', 'True'
    }
}
// The packaged-surface verification script is gone: it asserted 26.2 class names that no longer
// exist. Rewrite it with the material-rule compiler work before re-registering the surface harness.

def runtimeCheck = tasks.register('runtimeCheck') {
    group = 'verification'
    description = 'Runs the Arena palette, chunk NBT parity, fast tick and radius-16 worldgen checks.'
    // TODO(26.3): Add the packaged Surface checks back with that harness.
    dependsOn('testArenaPaletteDifferential', 'testChunkNbtParity', 'testFastTickRuntime',
            'runTestWorldGen')
}

tasks.register('ciCheck') {
    group = 'verification'
    description = 'Runs production, startup, and runtime verification for continuous integration.'
    dependsOn(tasks.named('check'), tasks.named('startupCheck'), runtimeCheck)
}

def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
    configurations.named(variant) {
        attributes.attribute(loaderAttribute, 'neoforge')
    }
}
sourceSets.configureEach {
    [compileClasspathConfigurationName, runtimeClasspathConfigurationName,
     getTaskName(null, 'jarJar')].each { variant ->
        configurations.named(variant) {
            attributes.attribute(loaderAttribute, 'neoforge')
        }
    }
}
