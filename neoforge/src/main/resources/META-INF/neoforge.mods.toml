modLoader = "javafml"
loaderVersion = "${neoforge_loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[mixins]]
config = "${mod_id}.mixins.json"

["lithium:options"]
"mixin.world.chunk_access" = false
"mixin.alloc.nbt" = false

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "c2me"
type = "optional"
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "noisiumed"
type = "incompatible"
reason = "Please use ZFastNoise instead"
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "noisium"
type = "incompatible"
reason = "Please use ZFastNoise instead"
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "antixray"
type = "incompatible"
reason = "ByePregen does not work with anti-xray mods"
versionRange = "[0,)"
ordering = "NONE"
side = "BOTH"
