plugins {
    id 'java-library'
    id 'maven-publish'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('tag', 'reason:a:Reason:')
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : project.version,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor' : mod_authors,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    def expandProps = [
            version                      : project.version,
            minecraft_version            : minecraft_version,
            minecraft_version_range      : minecraft_version_range,
            fabric_api_version           : fabric_api_version,
            fabric_loader_version        : fabric_loader_version,
            mod_name                     : mod_name,
            mod_authors                  : mod_authors,
            mod_id                       : mod_id,
            mod_license                  : mod_license,
            mod_description              : mod_description,
            neoforge_version             : neoforge_version,
            neoforge_loader_version_range: neoforge_loader_version_range,
            java_version                 : java_version
    ]
    def jsonProps = expandProps.collectEntries { key, value ->
        [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
    }

    filesMatching('META-INF/neoforge.mods.toml') {
        expand expandProps
    }
    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonProps
    }
    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
}
