plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets {
    test {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    surfaceTest {
        java.setSrcDirs(['src/surfaceTest/java'])
        resources.setSrcDirs(['src/surfaceTest/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    benchmark {
        java.setSrcDirs(['src/benchmark/java'])
        resources.setSrcDirs(['src/benchmark/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    worldgenHarness {
        java.setSrcDirs(['src/worldgenHarness/java'])
        resources.setSrcDirs(['src/worldgenHarness/resources'])
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

configurations {
    benchmarkCompileOnly.extendsFrom compileOnly
    benchmarkAnnotationProcessor.extendsFrom annotationProcessor
    surfaceTestCompileOnly.extendsFrom compileOnly
    surfaceTestAnnotationProcessor.extendsFrom annotationProcessor
    worldgenHarnessCompileOnly.extendsFrom compileOnly
    worldgenHarnessAnnotationProcessor.extendsFrom annotationProcessor
    testCompileOnly.extendsFrom compileOnly
    testAnnotationProcessor.extendsFrom annotationProcessor
}

def runJavaVersion = providers.gradleProperty('byepregenRunJavaVersion')
        .map(Integer::parseInt)
        .orElse(21)
def runJavaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(runJavaVersion.get())
}
ext.byepregenRunJavaLauncher = runJavaLauncher

apply from: 'gradle/byepregen-dependencies.gradle'
apply from: 'gradle/byepregen-server-fixtures.gradle'
def surfaceDumpClassesDirectory = providers.systemProperty('byepregen.surfaceDumpClasses')
afterEvaluate {
    tasks.named('runTestWorldGen', JavaExec) {
        javaLauncher.set(runJavaLauncher)
    }
}
tasks.withType(JavaExec).matching { it.name != 'runTestWorldGen' }.configureEach {
    javaLauncher.convention(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(runJavaVersion.get())
    })
}
tasks.withType(JavaExec).configureEach {
    if (surfaceDumpClassesDirectory.present) {
        systemProperty 'byepregen.surfaceDumpClasses', surfaceDumpClassesDirectory.get()
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        byepregen_worldgen_harness {
            sourceSet(sourceSets.worldgenHarness)
        }
    }

    runs {
        client {
            client()
            loadedMods.set([neoForge.mods.named(project.mod_id).get()] as Set)
            jvmArgument '-Xmx16G'

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            loadedMods.set([neoForge.mods.named(project.mod_id).get()] as Set)
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            loadedMods.set([neoForge.mods.named(project.mod_id).get()] as Set)
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            loadedMods.set([neoForge.mods.named(project.mod_id).get()] as Set)

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

}

apply from: 'gradle/byepregen-packaged-surface-linkage.gradle'
apply from: 'gradle/byepregen-worldgen-run-support.gradle'
apply from: 'gradle/byepregen-worldgen-smoke.gradle'
apply from: 'gradle/byepregen-light-verification.gradle'

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.named('jar', Jar) {
    exclude 'com/moepus/byepregen/test/**'
    exclude 'com/moepus/byepregen/bootstrap/TestWorldGenBootstrap.class'
}

apply from: 'gradle/byepregen-unit-verification.gradle'

def runtimeCheck = tasks.register('runtimeCheck') {
    group = 'verification'
    description = 'Runs packaged Surface linkage, opaque runtime, and radius-16 worldgen smoke checks.'
    dependsOn('runSurfacePackagedLinkage', 'testSurfaceOpaqueRuntime', 'runTestWorldGen')
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
