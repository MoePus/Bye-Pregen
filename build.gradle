plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        url "https://cursemaven.com"
    }
    maven {
        url "https://maven.caffeinemc.net/releases"
    }
    maven {
        url "https://maven.su5ed.dev/releases"
    }
    maven {
        url "https://jitpack.io"
        content {
            includeGroup "com.github.bawnorton.mixinsquared"
        }
    }
    exclusiveContent {
        forRepository {
            ivy {
                name = "vendoredMixinSquared"
                url = uri("libs")
                patternLayout {
                    artifact "[artifact]-[revision].[ext]"
                }
                metadataSources {
                    artifact()
                }
            }
        }
        filter {
            includeGroup "com.github.bawnorton.mixinsquared"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

apply from: 'gradle/byepregen-test-runs.gradle'

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            jvmArgument '-Xmx16G'

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(Jar).configureEach {
    exclude 'com/moepus/byepregen/test/**'
}

def sodiumOuterRuntime = configurations.detachedConfiguration(
        dependencies.create("net.caffeinemc:sodium-neoforge:${sodium_version}+mc${minecraft_version}")
)
sodiumOuterRuntime.transitive = false

def sodiumModRuntime = configurations.detachedConfiguration(
        dependencies.create("net.caffeinemc:sodium-neoforge-mod:${sodium_version}+mc${minecraft_version}")
)
sodiumModRuntime.transitive = false

def sodiumDevRuntimeMod = tasks.register('sodiumDevRuntimeMod', Zip) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { zipTree(sodiumModRuntime.singleFile) }
    from({ zipTree(sodiumOuterRuntime.singleFile) }) {
        exclude 'META-INF/neoforge.mods.toml'
        exclude 'META-INF/jarjar/**'
    }
    archiveBaseName = 'sodium-neoforge-dev-runtime-mod'
    archiveVersion = "${sodium_version}+mc${minecraft_version}"
    archiveExtension = 'jar'
    destinationDirectory = layout.buildDirectory.dir('runtime-libs')
}

// This unreleased version is vendored in libs, but retains its real coordinates for JarJar deduplication.
def mixinSquaredVersion = '0.3.7-beta.1'
def mixinSquaredCommon = "com.github.bawnorton.mixinsquared:mixinsquared-common:${mixinSquaredVersion}"
def mixinSquaredNeoForge = "com.github.bawnorton.mixinsquared:mixinsquared-neoforge:${mixinSquaredVersion}"

dependencies {
    implementation "curse.maven:zfastnoise-1460602:8294347"
    compileOnly mixinSquaredCommon
    annotationProcessor mixinSquaredCommon
    runtimeOnly mixinSquaredNeoForge
    jarJar mixinSquaredNeoForge
    compileOnly files("libs/c2me-neoforge-base-mc1.21.1-0.4.0-alpha.0.116-all.jar")
    compileOnly files("libs/c2me-neoforge-rewrites-chunkio-mc1.21.1-0.4.0-alpha.0.116.jar")
    compileOnly files("libs/c2me-neoforge-rewrites-chunk-system-mc1.21.1-0.4.0-alpha.0.116.jar")
    compileOnly files("libs/c2me-neoforge-opts-scheduling-mc1.21.1-0.4.0-alpha.0.116.jar")
//    additionalRuntimeClasspath "curse.maven:c2me-ocl-1563823:8436419"
    compileOnly "com.ibm.async:asyncutil:0.1.0"
    compileOnly files("libs/voxy-0.2.15-beta-3.jar")
    runtimeOnly "curse.maven:c2me-533097:8480771"
    runtimeOnly "curse.maven:lithium-360438:7740400"
    runtimeOnly "net.caffeinemc:sodium-neoforge-api:${sodium_version}+mc${minecraft_version}"
    runtimeOnly files(sodiumDevRuntimeMod.flatMap { it.archiveFile }) {
        builtBy sodiumDevRuntimeMod
    }
    runtimeOnly "org.sinytra.forgified-fabric-api:fabric-api-base:0.4.42+d1308ded19"
    runtimeOnly "org.sinytra.forgified-fabric-api:fabric-renderer-api-v1:3.4.1+9125b6dc19"
    runtimeOnly "org.sinytra.forgified-fabric-api:fabric-rendering-data-attachment-v1:0.3.48+73761d2e19"
    runtimeOnly "org.sinytra.forgified-fabric-api:fabric-block-view-api-v2:1.0.10+9afaaf8c19"

    compileOnly "curse.maven:architectury-api-419699:5786327"

    compileOnly "curse.maven:chunky-pregenerator-forge-485681:6383261"
    runtimeOnly "curse.maven:chunky-pregenerator-forge-485681:6383261"

    compileOnly "curse.maven:sable-1312371:8263584"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
